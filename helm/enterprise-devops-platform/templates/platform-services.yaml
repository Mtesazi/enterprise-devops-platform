{{- range $name, $svc := .Values.platform.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "enterprise-devops-platform.namespace" $ }}
  labels:
    {{- include "enterprise-devops-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      {{- include "enterprise-devops-platform.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "enterprise-devops-platform.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $secretEnv := $svc.secretEnv }}
            - name: {{ $secretEnv.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ default $.Values.secrets.name $secretEnv.secretKeyRef.name }}
                  key: {{ $secretEnv.secretKeyRef.key }}
            {{- end }}
          {{- if $svc.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $svc.probes.path }}
              port: http
            initialDelaySeconds: {{ $svc.probes.readinessInitialDelaySeconds }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $svc.probes.path }}
              port: http
            initialDelaySeconds: {{ $svc.probes.livenessInitialDelaySeconds }}
            periodSeconds: 20
          {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "enterprise-devops-platform.namespace" $ }}
  labels:
    {{- include "enterprise-devops-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: {{ $svc.service.type }}
  selector:
    {{- include "enterprise-devops-platform.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
