{{- if .Values.monitoring.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "enterprise-devops-platform.fullname" . }}-grafana-dashboards
  namespace: {{ include "enterprise-devops-platform.namespace" . }}
  labels:
    {{- include "enterprise-devops-platform.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  platform-services.json: |-
{{ .Files.Get "dashboards/platform-services.json" | indent 4 }}
{{- end }}
