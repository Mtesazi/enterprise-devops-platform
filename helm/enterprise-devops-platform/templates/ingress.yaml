{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "enterprise-devops-platform.fullname" . }}-gateway
  namespace: {{ include "enterprise-devops-platform.namespace" . }}
  labels:
    {{- include "enterprise-devops-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
{{- end }}
