global:
  namespaceOverride: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: platform.local
  path: /
  pathType: Prefix
  tls: []

secrets:
  create: true
  name: platform-secrets
  jwt:
    gateway: "change-me-in-production"
    auth: "change-me-in-production"
  databases:
    username: "postgres"
    password: "password"

monitoring:
  # All observability resources are no-ops unless explicitly enabled, so clusters
  # without the Prometheus Operator (ServiceMonitor/PrometheusRule CRDs) or a
  # Grafana dashboard sidecar are unaffected by default.
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /actuator/prometheus
    # Labels the Prometheus Operator's own ServiceMonitor selector looks for,
    # e.g. `release: kube-prometheus-stack`. Left empty by default.
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # Thresholds used by the bundled alert rules; tune per environment.
    errorRateThreshold: "0.05"
    latencyP95ThresholdSeconds: "1"
    jvmHeapUsageThreshold: "0.85"
  grafanaDashboards:
    enabled: false
    # Label most kube-prometheus-stack / Grafana sidecars watch for to auto-load
    # dashboard ConfigMaps.
    labels:
      grafana_dashboard: "1"

postgresql:
  enabled: false
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "0"
  auth:
    postgresPassword: "password"
    username: "platform"
    password: "password"
    database: "platform"
  primary:
    persistence:
      enabled: false

kafka:
  enabled: false
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "0"
  listeners:
    client:
      protocol: PLAINTEXT
  externalAccess:
    enabled: false

platform:
  services:
    config-server:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/config-server
        tag: latest
      service:
        type: ClusterIP
        port: 8888
      containerPort: 8888
      env:
        SERVER_PORT: "8888"
        SPRING_PROFILES_ACTIVE: "native"
      probes:
        enabled: true
        path: /actuator/health
        readinessInitialDelaySeconds: 20
        livenessInitialDelaySeconds: 40
      resources: {}

    discovery-server:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/discovery-server
        tag: latest
      service:
        type: ClusterIP
        port: 8761
      containerPort: 8761
      env:
        SERVER_PORT: "8761"
        EUREKA_CLIENT_ENABLED: "false"
        EUREKA_SERVER_DEFAULT_ZONE: "http://discovery-server:8761/eureka"
      probes:
        enabled: true
        path: /actuator/health
        readinessInitialDelaySeconds: 20
        livenessInitialDelaySeconds: 40
      resources: {}

    gateway-service:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/gateway-service
        tag: latest
      service:
        type: ClusterIP
        port: 8080
      containerPort: 8080
      env:
        SERVER_PORT: "8080"
        CONFIG_SERVER_URL: "http://config-server:8888"
        EUREKA_CLIENT_SERVICE_URL: "http://discovery-server:8761/eureka"
        GATEWAY_AUTH_ENABLED: "true"
      probes:
        enabled: true
        path: /actuator/health
        readinessInitialDelaySeconds: 20
        livenessInitialDelaySeconds: 40
      resources: {}
      secretEnv:
        - name: GATEWAY_JWT_SECRET
          secretKeyRef:
            name: platform-secrets
            key: gateway-jwt-secret

    auth-service:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/auth-service
        tag: latest
      service:
        type: ClusterIP
        port: 8083
      containerPort: 8083
      env:
        SERVER_PORT: "8083"
        CONFIG_SERVER_URL: "http://config-server:8888"
        EUREKA_CLIENT_SERVICE_URL: "http://discovery-server:8761/eureka"
        SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/auth_db"
      probes:
        enabled: true
        path: /actuator/health
        readinessInitialDelaySeconds: 20
        livenessInitialDelaySeconds: 40
      resources: {}
      secretEnv:
        - name: SPRING_DATASOURCE_USERNAME
          secretKeyRef:
            name: platform-secrets
            key: database-username
        - name: SPRING_DATASOURCE_PASSWORD
          secretKeyRef:
            name: platform-secrets
            key: database-password
        - name: SECURITY_JWT_SECRET
          secretKeyRef:
            name: platform-secrets
            key: auth-jwt-secret

    employee-service:
      enabled: true
      replicaCount: 1
      image:
