global:
  namespaceOverride: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: platform.local
  path: /
  pathType: Prefix
  tls: []

platform:
  services:
    config-server:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/config-server
        tag: latest
      service:
        type: ClusterIP
        port: 8888
      containerPort: 8888
      env:
        SERVER_PORT: "8888"
        SPRING_PROFILES_ACTIVE: "native"
      probes:
        enabled: true
        path: /actuator/health
        readinessInitialDelaySeconds: 20
        livenessInitialDelaySeconds: 40
      resources: {}

    discovery-server:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/discovery-server
        tag: latest
      service:
        type: ClusterIP
        port: 8761
      containerPort: 8761
      env:
        SERVER_PORT: "8761"
        EUREKA_CLIENT_ENABLED: "false"
        EUREKA_SERVER_DEFAULT_ZONE: "http://discovery-server:8761/eureka"
      probes:
        enabled: true
        path: /actuator/health
        readinessInitialDelaySeconds: 20
        livenessInitialDelaySeconds: 40
      resources: {}

    gateway-service:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/gateway-service
        tag: latest
      service:
        type: ClusterIP
        port: 8080
      containerPort: 8080
      env:
        SERVER_PORT: "8080"
        CONFIG_SERVER_URL: "http://config-server:8888"
        EUREKA_CLIENT_SERVICE_URL: "http://discovery-server:8761/eureka"
        GATEWAY_AUTH_ENABLED: "true"
        GATEWAY_JWT_SECRET: "change-me-in-production"
      probes:
        enabled: true
        path: /actuator/health
        readinessInitialDelaySeconds: 20
        livenessInitialDelaySeconds: 40
      resources: {}

    auth-service:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/auth-service
        tag: latest
      service:
        type: ClusterIP
        port: 8083
      containerPort: 8083
      env:
        SERVER_PORT: "8083"
        CONFIG_SERVER_URL: "http://config-server:8888"
        EUREKA_CLIENT_SERVICE_URL: "http://discovery-server:8761/eureka"
        SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/auth_db"
        SPRING_DATASOURCE_USERNAME: "postgres"
        SPRING_DATASOURCE_PASSWORD: "password"
        SECURITY_JWT_SECRET: "change-me-in-production"
      probes:
        enabled: true
        path: /actuator/health
        readinessInitialDelaySeconds: 20
        livenessInitialDelaySeconds: 40
      resources: {}

    employee-service:
      enabled: true
      replicaCount: 1
      image:
        repository: enterprise-devops-platform/employee-service
        tag: latest
      service:
        type: ClusterIP
        port: 8081
