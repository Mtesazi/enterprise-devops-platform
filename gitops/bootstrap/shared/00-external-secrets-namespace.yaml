# Reserves the namespace consumed by the External Secrets Operator (ESO).
#
# This is a cluster-scoped resource shared by every environment on this
# cluster, so it lives here instead of under `bootstrap/dev` or
# `bootstrap/prod` to avoid two Argo CD Applications fighting over
# ownership of the same Namespace object.
#
# Operator installation and ClusterSecretStore/ExternalSecret resources are
# wired up in `feature/external-secrets-integration`. This manifest only
# guarantees the namespace exists ahead of that work.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/part-of: enterprise-devops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
