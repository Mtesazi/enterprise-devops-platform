apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-bootstrap-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: enterprise-devops-platform
  source:
    repoURL: https://github.com/Mtesazi/enterprise-devops-platform.git
    targetRevision: main
    path: gitops/bootstrap/shared
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
