apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: enterprise-devops-platform
  source:
    repoURL: https://github.com/Mtesazi/enterprise-devops-platform.git
    targetRevision: main
    path: gitops/argocd/apps/prod
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
