spring:
  application:
    name: discovery-server
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
      import-check:
        enabled: false
  config:
    import: optional:${CONFIG_IMPORT:}

server:
  port: ${SERVER_PORT:8761}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: false
    fetch-registry: false
    service-url:
      # Deliberately NOT named EUREKA_CLIENT_SERVICE_URL: that name relaxed-binds onto the
      # Map-typed 'eureka.client.service-url' itself, and binding a scalar to a Map fails
      # with ConverterNotFoundException while EurekaServerAutoConfiguration builds
      # EurekaClientConfigBean - which stops the registry from starting at all.
      defaultZone: ${EUREKA_SERVER_DEFAULT_ZONE:http://localhost:8761/eureka}
  server:
    enable-self-preservation: false
