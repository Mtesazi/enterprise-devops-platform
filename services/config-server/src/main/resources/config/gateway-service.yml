spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          httpclient:
            connect-timeout: 2000
            response-timeout: 3s

services:
  auth:
    base-url: lb://auth-service
  employee:
    base-url: lb://employee-service
  department:
    base-url: lb://department-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:application}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

security:
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:true}
    jwt-secret: ${GATEWAY_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    public-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/me
      - /login
      - /register
      - /actuator/health
      - /actuator/prometheus
      - /actuator/metrics
      - /swagger-ui/**
      - /swagger/**
      - /v3/api-docs/**
