spring:
  application:
    name: employee-service
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
      import-check:
        enabled: false
  kafka:
    # docker-compose already passes KAFKA_BOOTSTRAP_SERVERS; without this the producer
    # silently falls back to localhost:9092 and POST /api/employees blocks on
    # metadata lookup (max.block.ms) after the employee has already been committed.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:${CONFIG_IMPORT:}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH:true}

server:
  port: ${SERVER_PORT:8081}

services:
  department:
    base-url: ${SERVICES_DEPARTMENT_BASE_URL:http://department-service}
    connect-timeout: 2s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      departmentService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # An unknown department is a caller error, not a department-service outage:
        # counting it as a failure would let bad input trip the breaker for everyone.
        ignore-exceptions:
          - com.mtesazi.employeeservice.exception.DepartmentReferenceNotFoundException
  retry:
    instances:
      departmentService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Allow-list: an unknown department or an unexpected 4xx is never retried.
        retry-exceptions:
          - com.mtesazi.employeeservice.exception.DepartmentServiceCommunicationException
          - com.mtesazi.employeeservice.exception.DepartmentServiceTimeoutException
